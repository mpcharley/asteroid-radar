name: Build and Release Game

on:
  push:
    tags:
      - 'v*'  # Запускается при создании тега, например v1.0.0

jobs:
  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows
            os: windows-latest
            extension: .exe
          - platform: linux
            os: ubuntu-latest
            extension: .x86_64
          - platform: macos
            os: macos-latest
            extension: .zip  # Для macOS часто делают .zip

    steps:
      # 1. Загружаем код из репозитория
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Godot (используем проверенное действие)
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          godot-version: 4.2.1  # Укажите вашу версию

      # 3. Собираем проект
      - name: Export game
        run: |
          mkdir -p build
          godot --headless --export-release "${{ matrix.platform }}" "build/game-${{ matrix.platform }}${{ matrix.extension }}"

      # 4. Загружаем собранный файл как артефакт
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: build/game-${{ matrix.platform }}${{ matrix.extension }}

  release:
    name: Create Release and Upload Assets
    needs: export  # Ждём завершения всех сборок
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      # 1. Скачиваем все собранные артефакты
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 2. Создаём релиз и прикрепляем к нему файлы
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
