name: Build and Release

on:
  push:
    tags:
      - 'v*'                     # Запуск при тегах v1.0.0, v2.3, etc.

jobs:
  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: "Linux"              # точно как в export_presets.cfg
            extension: ".x86_64"
          - platform: macOS
            os: macos-latest
            preset: "macOS"
            extension: ".zip"
          - platform: Windows
            os: windows-latest
            preset: "Windows Desktop"     # с пробелом, в кавычках
            extension: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1               # ваша версия
          include-templates: true

      # Отладочный шаг: показать все доступные пресеты
      - name: List export presets
        run: |
          echo "=== Список пресетов ==="
          godot --headless --list-export-presets --path .

      - name: Export game
        run: |
          mkdir -p build
          godot --headless --export-release "${{ matrix.preset }}" "build/game-${{ matrix.platform }}${{ matrix.extension }}" --path .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: build/game-${{ matrix.platform }}${{ matrix.extension }}
        if: always()   # загружаем даже если предупреждение, чтобы увидеть, что создалось

  release:
    name: Create Release and Upload Assets
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
