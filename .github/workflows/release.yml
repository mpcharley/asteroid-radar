name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: "Linux"
            artifact_name: "AsteroidRadar_Linux.x86_64"
          - platform: "Windows Desktop"
            os: windows-latest
            preset: "Windows Desktop"
            artifact_name: "AsteroidRadar_Windows.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          include-templates: true
          cache: true

      - name: Export game
        shell: bash
        run: |
          mkdir -p build
          godot --headless --export-release "${{ matrix.preset }}" "build/${{ matrix.artifact_name }}" --path . --quit --verbose
          echo "Export exit code: $?"
          ls -la build/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/${{ matrix.artifact_name }}
        if: always()

  release:
    name: Create Release and Upload Assets
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}   # или GITHUB_TOKEN, если настроили права
