name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: "Linux"
            extension: ".x86_64"
          - platform: macOS
            os: macos-latest
            preset: "macOS"
            extension: ".zip"
          - platform: Windows
            os: windows-latest
            preset: "Windows Desktop"
            extension: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1            # ваша текущая версия
          include-templates: true
          cache: true

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: AsteroidRadar_${{ matrix.platform }}
          path: build/AsteroidRadar_${{ matrix.platform }}${{ matrix.extension }}
        if: always()

  release:
    name: Create Release and Upload Assets
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
