name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: "Linux"
            extension: ".x86_64"
          - platform: macOS
            os: macos-latest
            preset: "macOS"
            extension: ".zip"
          - platform: Windows
            os: windows-latest
            preset: "Windows Desktop"
            extension: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1            # ваша текущая версия
          include-templates: true
          cache: true

      # ----- ОТЛАДОЧНЫЕ ШАГИ -----
      - name: Показать список пресетов (полный вывод)
        run: |
          echo "=== ДОСТУПНЫЕ ПРЕСЕТЫ ==="
          godot --headless --list-export-presets --path . 2>&1

      - name: Попытка экспорта с выводом ошибок
        run: |
          echo "Запуск экспорта для пресета: ${{ matrix.preset }}"
          godot --headless --export-release "${{ matrix.preset }}" "build/game-${{ matrix.platform }}${{ matrix.extension }}" 2>&1
          echo "Код возврата: $?"
          echo "Содержимое папки build:"
          ls -la build/ || echo "Папка build пуста или не существует"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.platform }}
          path: build/game-${{ matrix.platform }}${{ matrix.extension }}
        if: always()   # загружаем даже если файла нет – увидим предупреждение

  release:
    name: Create Release and Upload Assets
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
