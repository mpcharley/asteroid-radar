name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    name: Export for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            preset: "Linux"
            artifact_name: "AsteroidRadar_Linux.x86_64"
          - platform: Windows
            os: windows-latest
            preset: "Windows Desktop"
            artifact_name: "AsteroidRadar_Windows.exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          include-templates: true
          cache: true

      # ----- ОТЛАДКА: проверка файлов (используем bash) -----
      - name: Проверка наличия файлов
        shell: bash
        run: |
          echo "=== Содержимое корневой папки ==="
          ls -la
          echo "=== Проверка export_presets.cfg ==="
          head -n 20 export_presets.cfg || echo "Файл не найден"
          echo "=== Проверка project.godot ==="
          head -n 20 project.godot || echo "Файл не найден"

      - name: Список доступных пресетов
        shell: bash
        run: |
          echo "=== ДОСТУПНЫЕ ПРЕСЕТЫ ==="
          godot --headless --list-export-presets --path . 2>&1

      # ----- ЭКСПОРТ -----
      - name: Экспорт игры
        shell: bash
        run: |
          mkdir -p build
          echo "Запуск экспорта для пресета: ${{ matrix.preset }}"
          godot --headless --export-release "${{ matrix.preset }}" "build/${{ matrix.artifact_name }}" --path . --verbose
          echo "Код возврата: $?"
          echo "Содержимое папки build:"
          ls -la build/ || echo "Папка build пуста"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/${{ matrix.artifact_name }}
        if: always()

  release:
    name: Create Release and Upload Assets
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
