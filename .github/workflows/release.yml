name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  export:
    name: Export for Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          include-templates: true
          cache: true

      - name: Импорт проекта
        shell: bash
        run: |
          echo "=== Импорт проекта ==="
          godot --headless --import --path . --quit 2>&1
          echo "=== Проверка .godot ==="
          ls -la .godot/ || echo ".godot не создан"

      - name: Список доступных пресетов
        shell: bash
        run: |
          echo "=== ДОСТУПНЫЕ ПРЕСЕТЫ ==="
          godot --headless --list-export-presets --path . --quit 2>&1

      - name: Экспорт игры
        shell: bash
        run: |
          mkdir -p build
          echo "Запуск экспорта для пресета: Linux"
          godot --headless --export-release "Linux" "build/AsteroidRadar_Linux.x86_64" --path . --quit --verbose 2>&1
          echo "Код возврата: $?"
          echo "Содержимое папки build:"
          ls -la build/ || echo "Папка build пуста"

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: AsteroidRadar_Linux
          path: build/AsteroidRadar_Linux.x86_64
        if: always()

  release:
    name: Create Release and Upload Assets
    needs: export
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
